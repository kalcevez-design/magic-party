<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Solo se permite el código propio, la API y las imágenes de Scryfall -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src https://api.scryfall.com; img-src 'self' https://cards.scryfall.io; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Magic Party (título provisional)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Configuración: lista (query de Scryfall) y jugadores -->
    <section id="pantalla-config" class="pantalla config">
      <h1>Magic Party</h1>
      <label for="query">Lista (búsqueda de Scryfall)</label>
      <input id="query" type="text" value="set:ltr lang:es" spellcheck="false">
      <label for="jugadores">Jugadores (uno por línea)</label>
      <textarea id="jugadores" rows="5" spellcheck="false"></textarea>
      <div class="controles">
        <button id="btn-cargar">Empezar</button>
        <button id="btn-reiniciar" class="secundario" hidden>Poner marcador a cero</button>
      </div>
      <p id="estado" aria-live="polite"></p>
    </section>

    <!-- Juego: ilustración a la izquierda, marcador a la derecha -->
    <section id="pantalla-juego" class="pantalla juego" hidden>
      <div class="escena">
        <p id="ronda" class="ronda"></p>
        <img id="arte" alt="Ilustración de la carta">
        <p id="artista" class="artista"></p>
        <div id="datos" class="datos" hidden></div>
        <div class="controles">
          <button id="btn-resolver">Resolver</button>
          <button id="btn-siguiente">Siguiente</button>
          <button id="btn-volver" class="secundario">Cambiar lista</button>
        </div>
      </div>
      <aside class="marcador">
        <h2>Marcador</h2>
        <ol id="marcador"></ol>
      </aside>
    </section>
  </main>

  <footer>
    Magic Party is unofficial Fan Content permitted under the Fan Content Policy.
    Not approved/endorsed by Wizards. Portions of the materials used are property of
    Wizards of the Coast. ©Wizards of the Coast LLC. Datos e imágenes: Scryfall.
  </footer>

  <script src="app.js"></script>
</body>
</html>
